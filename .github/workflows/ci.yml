name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run check:ci

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run check-types

  test-js:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all -- -D warnings

  test-rust:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  build:
    needs: [typecheck, test-rust, test-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install
      - run: bun run build
      - run: cargo build --release --all

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun pm audit || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
              - 'packages/infra/**'
      - uses: superfly/flyctl-action/setup-flyctl@master
        if: steps.changes.outputs.server == 'true'
      - run: flyctl deploy --remote-only --depot=false --config Fly.toml --dockerfile Dockerfile
        if: steps.changes.outputs.server == 'true'
        working-directory: apps/server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.web == 'true'
        with:
          bun-version: "1.3.9"
      - run: bun install && cd packages/infra && bun run alchemy.run.ts
        if: steps.changes.outputs.web == 'true'
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
