name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run check:ci

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run check-types

  doctor:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run doctor

  test-js:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun run test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all -- -D warnings

  test-rust:
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  build:
    needs: [typecheck, doctor, test-rust, test-js]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: ""
            suffix: ""
          - os: macos-latest
            platform: macos
            target: ""
            suffix: "-macos-aarch64"
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            suffix: "-windows-x86_64.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: bun install
      - run: bun run build:ci
      - name: Build release
        run: cargo build --release --all
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
      - name: Rename binary
        if: matrix.suffix != ''
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/relay.exe target/release/relay${{ matrix.suffix }}
          else
            mv target/release/relay target/release/relay${{ matrix.suffix }}
          fi
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/relay${{ matrix.suffix }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install
      - run: bun pm audit || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
              - 'packages/infra/**'
      - uses: superfly/flyctl-action/setup-flyctl@master
        if: steps.changes.outputs.server == 'true'
      - run: flyctl deploy --remote-only --depot=false --config Fly.toml --dockerfile Dockerfile
        if: steps.changes.outputs.server == 'true'
        working-directory: apps/server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.web == 'true'
        with:
          bun-version: "1.3.9"
      - run: bun install && cd packages/infra && bun run alchemy.run.ts
        if: steps.changes.outputs.web == 'true'
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
