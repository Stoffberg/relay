name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross-compilation (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p relay-agent

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../relay-${{ matrix.target }}.tar.gz relay
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: relay-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/relay-x86_64-apple-darwin/relay-x86_64-apple-darwin.tar.gz
            artifacts/relay-aarch64-apple-darwin/relay-aarch64-apple-darwin.tar.gz
            artifacts/relay-x86_64-unknown-linux-gnu/relay-x86_64-unknown-linux-gnu.tar.gz
            artifacts/relay-aarch64-unknown-linux-gnu/relay-aarch64-unknown-linux-gnu.tar.gz
