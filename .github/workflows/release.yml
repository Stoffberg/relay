name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: blacksmith-6vcpu-macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: blacksmith-6vcpu-macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-4vcpu-ubuntu-2404
            archive: tar.gz
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: blacksmith-4vcpu-windows-2025
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p relay-agent

      - name: Build with cargo
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p relay-agent

      - name: Package binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../relay-${{ matrix.target }}.tar.gz relay
          cd ../../..

      - name: Package binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/relay.exe" -DestinationPath "relay-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: relay-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/relay-x86_64-apple-darwin/relay-x86_64-apple-darwin.tar.gz
            artifacts/relay-aarch64-apple-darwin/relay-aarch64-apple-darwin.tar.gz
            artifacts/relay-x86_64-unknown-linux-gnu/relay-x86_64-unknown-linux-gnu.tar.gz
            artifacts/relay-aarch64-unknown-linux-gnu/relay-aarch64-unknown-linux-gnu.tar.gz
            artifacts/relay-x86_64-pc-windows-msvc/relay-x86_64-pc-windows-msvc.zip
