[package]
name = "relay-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
spacetimedb-sdk = "2.0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
regex = "1"
clap = { version = "4.5.60", features = ["derive"] }
dialoguer = "0.12.0"
toml = "1.0.3"
home = "0.5.12"
