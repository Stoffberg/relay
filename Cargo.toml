[workspace]
members = [
    "apps/server",
    "apps/agent",
    "packages/spacetime"
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
spacetimedb-sdk = "2.0.2"
uuid = { version = "1", features = ["v4"] }
